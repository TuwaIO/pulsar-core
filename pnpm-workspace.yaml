packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  esbuild: false
  sharp: false

minimumReleaseAgeExclude:
  - '@tuwaio/*'
  - framer-motion@14.0.0 || 14.3.0
  - motion-dom@14.0.0 || 14.3.0
  - motion-utils@14.0.0
  - viem
  - '@tailwindcss/*'
  - '@typescript-eslint/*'
  - prettier
  - tailwindcss
  - typescript-eslint
  - eslint@10.8.1
  - '@next/env@16.3.7 || 16.4.1'
  - '@next/swc-darwin-arm64@16.3.7 || 16.4.1'
  - '@next/swc-darwin-x64@16.3.7 || 16.4.1'
  - '@next/swc-linux-arm64-gnu@16.3.7 || 16.4.1'
  - '@next/swc-linux-arm64-musl@16.3.7 || 16.4.1'
  - '@next/swc-linux-x64-gnu@16.3.7 || 16.4.1'
  - '@next/swc-linux-x64-musl@16.3.7 || 16.4.1'
  - '@next/swc-win32-arm64-msvc@16.3.7 || 16.4.1'
  - '@next/swc-win32-x64-msvc@16.3.7 || 16.4.1'
  - next@16.3.7 || 16.4.1
  - '@asamuzakjp/dom-selector@10.0.3'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - dotenv@18.0.8
  - jsdom@30.1.3
  - react-dom@19.3.1
  - react@19.3.1
  - vitest@5.0.5
overrides:
  # nextra-theme-docs 4.6.1 validates its Layout props with zod; with zod 4.4 and newer the validation rejects them
  # ("expected nonoptional ... at children"). Keep 4.3 for Nextra.
  nextra>zod: 4.3.6
  nextra-theme-docs>zod: 4.3.6
